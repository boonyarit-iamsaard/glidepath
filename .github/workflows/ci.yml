name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to SHAs because tags are mutable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Not pnpm/action-setup: its self-installer crashes on pnpm 11.12.0
      # (`Cannot use 'in' operator to search for 'integrity'`).
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # No --trust-lockfile: CI re-applies minimumReleaseAge and trustPolicy to
      # every lockfile entry, before any installed tool runs.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run audit

      - run: pnpm run ci

      - name: Build the server image
        run: docker compose build --pull server

      # A build proves the image compiles. Only a run proves the runtime stage
      # carries every package that dist/index.mjs imports.
      - name: Smoke test the server image
        run: |
          cat > apps/server/.env <<'EOF'
          BETTER_AUTH_SECRET=throwaway-ci-smoke-test-secret-value
          BETTER_AUTH_URL=http://localhost:4000
          CORS_ORIGIN=http://localhost:3000
          EOF
          docker compose up --detach --wait --wait-timeout 120 server

      # Logs are diagnostics. They must never stop the cleanup that follows.
      - name: Collect logs and clean up
        if: always()
        run: |
          docker compose logs --no-color || true
          docker compose down --volumes || true
          rm -f apps/server/.env
