name: glidepath

services:
  server:
    container_name: glidepath-server
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    ports:
      - "4000:4000"
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/glidepath
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - glidepath-network

  postgres:
    image: postgres:18-alpine
    container_name: glidepath-postgres
    environment:
      POSTGRES_DB: glidepath
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - glidepath-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - glidepath-network

volumes:
  glidepath-postgres-data:
    name: glidepath-postgres-data

networks:
  glidepath-network:
    name: glidepath-network
