packages:
  - apps/*
  - packages/*
# strictDepBuilds makes a skipped build a hard failure, not a silent one.
allowBuilds:
  esbuild: true
dangerouslyAllowAllBuilds: false
strictDepBuilds: true

# 3 days.
minimumReleaseAge: 4320

# Judge only the last 30 days: pre-2023 releases predate provenance and trip this constantly.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200

engineStrict: true
verifyDepsBeforeRun: true
verifyStoreIntegrity: true

# Drop these once upstream ships the fixes. Each override stays on the
# offending path so it does not change unrelated dependency versions.
overrides:
  # esbuild <=0.24.2  GHSA-67mh-4wv8-2f99 (via @esbuild-kit, in drizzle-kit)
  "@esbuild-kit/core-utils>esbuild": ^0.25.12
  # nanoid <3.3.18  GHSA-2v37-7h3g-55p8 (via postcss)
  "postcss>nanoid": ^3.3.18

catalog:
  dotenv: ^17.4.2
  zod: ^4.4.3
  typescript: ^7.0.2
  "@types/node": ^24.13.3
  better-auth: 1.6.26
  lucide-react: ^1.29.0
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  sonner: ^2.0.7
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  tailwindcss: ^4.3.3
